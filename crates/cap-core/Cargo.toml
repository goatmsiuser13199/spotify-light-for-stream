[package]
name = "cap-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "cap_core"
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
mdns-sd = { workspace = true }
async-trait = "0.1"
plist = "1.6"

# airplay2-rs (GPL-2.0) — fork compilable sous MSVC
ap2rs-pairing = { package = "airplay-pairing", path = "../../vendor/airplay2-rs/crates/airplay-pairing" }
ap2rs-core = { package = "airplay-core", path = "../../vendor/airplay2-rs/crates/airplay-core" }
ap2rs-client = { package = "airplay-client", path = "../../vendor/airplay2-rs/crates/airplay-client" }
ap2rs-audio = { package = "airplay-audio", path = "../../vendor/airplay2-rs/crates/airplay-audio" }

[dev-dependencies]
tracing-subscriber = { workspace = true }
audio-capture = { path = "../audio-capture" }
crossbeam-channel = "0.5"
