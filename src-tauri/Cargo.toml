[package]
name = "app"
version = "0.1.0"
description = "Lightweight Spotify player for streaming"
authors = ["you"]
license = "GPL-2.0"
repository = ""
edition = "2021"
rust-version = "1.77"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = { workspace = true }
serde = { workspace = true }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
open = "5"
sysinfo = "0.33"
once_cell = "1"
tokio = { workspace = true }
crossbeam-channel = "0.5"
cap-core = { path = "../crates/cap-core" }
audio-capture = { path = "../crates/audio-capture" }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Devices_FunctionDiscovery",
] }
