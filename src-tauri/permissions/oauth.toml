[[permission]]
identifier = "allow-spotify-oauth"
description = "OAuth Spotify, audio Windows, prefs, AirPlay HomePod"
commands.allow = [
  "start_oauth_listener",
  "open_url",
  "append_log",
  "open_log_folder",
  "open_windows_sound_settings",
  "list_windows_audio_outputs",
  "set_windows_audio_output",
  "get_pref",
  "set_pref",
  "set_ui_hidden",
  "set_cpu_logging",
  "discover_devices",
  "start_discovery_stream",
  "stop_discovery_stream",
  "start_streaming",
  "stop_streaming",
  "set_stream_volume",
  "set_play_locally",
  "is_streaming",
]
